[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "contextturbine"
version = "0.1.0"
description = "Required-fact survival measurement for repeated agent context compression"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "RequiredTruth"}]
[project.scripts]
contextturbine = "contextturbine.cli:main"
[tool.setuptools.packages.find]
include = ["contextturbine*"]
